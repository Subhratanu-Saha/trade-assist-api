name: Yearly Version Bump

on:
  schedule:
    - cron: "0 0 1 1 *"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute versions
        id: ver
        run: |
          YY=$(date -u +%y)
          CURRENT_MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          echo "yy=$YY" >> $GITHUB_OUTPUT
          echo "current=$CURRENT_MAJOR" >> $GITHUB_OUTPUT
          echo "new=${YY}.0.0" >> $GITHUB_OUTPUT

      - name: Bump version
        if: steps.ver.outputs.current != steps.ver.outputs.yy
        run: |
          npm version ${{ steps.ver.outputs.new }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.ver.outputs.new }}"
          git tag "v${{ steps.ver.outputs.new }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD --tags