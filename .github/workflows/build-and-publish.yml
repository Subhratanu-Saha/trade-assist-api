name: Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Log pipeline metadata
        run: |
          mkdir -p logs
          echo "Repository: $GITHUB_REPOSITORY" >> logs/pipeline-summary.log
          echo "Branch: $GITHUB_REF_NAME" >> logs/pipeline-summary.log
          echo "Commit: $GITHUB_SHA" >> logs/pipeline-summary.log
          echo "Node version: $(node -v)" >> logs/pipeline-summary.log
          echo "npm version: $(npm -v)" >> logs/pipeline-summary.log
          echo "Workspace: $GITHUB_WORKSPACE" >> logs/pipeline-summary.log

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to render-server
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_URL }}

      - name: Write final pipeline summary
        if: always()
        run: |
          echo "Install step completed" >> logs/pipeline-summary.log
          echo "Build step completed" >> logs/pipeline-summary.log
          echo "Deploy step completed" >> logs/pipeline-summary.log

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs
          if-no-files-found: warn