name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (choose from dropdown)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - feature
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Use selected branch when triggered via workflow_dispatch, otherwise use the event ref (e.g. push to main)
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy to render-server
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_URL }}